# Clippy configuration. The lint levels themselves are crate attributes
# (architecture §A5), not settings here; this file only configures the lints.

# Matches rust-toolchain.toml, so clippy will not suggest an API newer than the
# version every crate is compiled with.
msrv = "1.99.0"

# Tests live in crates/<crate>/tests and tests/ (the lane gate refuses
# #[cfg(test)] in src). A test that unwraps is asserting, so the two panic lints
# denied in every crate root do not apply there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Everything is 0.0.0 and `publish = false`; there is no published API to keep
# source-compatible yet, so the lints that protect one would only add noise.
avoid-breaking-exported-api = false

# §A5: panics are caught at the service boundary and reported as platform
# errors, so a panic message is a developer-facing string and must be useful.
allow-dbg-in-tests = false
