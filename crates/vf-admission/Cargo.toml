[package]
name = "vf-admission"
description = "Fail-closed validating admission handler backed by the start-barrier decision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# §A5: Kubernetes is feature-gated. The barrier decision this handler wraps is
# testable without any cluster types.
kube = ["dep:k8s-openapi"]
# Enables the parts of the suite that need `just dev-up` services (§A6.2).
integration = []

[dependencies]
vf-core = { workspace = true }
vf-db = { workspace = true }
vf-authz = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
k8s-openapi = { workspace = true, optional = true }
