[package]
name = "vf-operator"
description = "ScanFlow reconcile loop, scan runtimes and tenant provisioning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# §A5: Kubernetes is feature-gated so this crate builds and is tested without
# it. The local ExecutionBackend and the FakeScanRuntime need none of it.
kube = ["dep:kube", "dep:kube-runtime", "dep:k8s-openapi"]
# Enables the parts of the suite that need `just dev-up` services (§A6.2).
integration = []

[dependencies]
vf-core = { workspace = true }
vf-db = { workspace = true }
vf-meter = { workspace = true }
vf-authz = { workspace = true }
vf-translator = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
kube = { workspace = true, optional = true }
kube-runtime = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
