# cargo-deny configuration. TDD §21.3 requires licences, advisories, bans and
# sources to be gated in CI, and the `build/rust-supply-chain` job runs this with
# `cargo deny check all`, which exits non-zero on any finding.
# Nothing here is a warning.

[graph]
# Aether is arm64 and IPv4-only (TDD §5.9). Checking only the target we ship
# keeps Windows/macOS-only transitive crates out of the advisory and licence
# verdicts, where they would be noise rather than risk.
targets = [
    { triple = "aarch64-unknown-linux-gnu" },
    # vf-graph is also shipped to the browser (TDD §7.3, §14.1).
    { triple = "wasm32-unknown-unknown" },
]
# Deliberately NOT `all-features = true`.
#
# `--all-features` is the wrong question here. It enables every optional feature
# of every crate in the graph, including the ones we chose against: it turns
# `rustls/ring` on, which makes the `ring` ban below fire on a crate that is not
# in any shipping build, and it turns on `serde_with/chrono`, same story. The
# gate would then be red for a configuration we never compile, and the usual way
# that gets resolved is by deleting the ban.
#
# The question worth asking is "what is in the artifact", so cargo-deny resolves
# the same default feature set the release build does. Verified on the pinned
# lockfile: with default features, `cargo tree -e normal -i ring` and
# `-i chrono` are both empty.
all-features = false

[advisories]
version = 2
# NOT the default `~/.cargo/advisory-db`: that path is also cargo-audit's
# default, and cargo-audit refuses to clone into a directory cargo-deny has
# already populated ("Refusing to initialize the non-empty directory"). Both
# tools run in the same job and §21.3 names both, so they get a directory each.
db-path = "~/.cargo/advisory-db-deny"
db-urls = ["https://github.com/rustsec/advisory-db"]
# No `ignore` entries. An advisory that must be accepted is accepted in an ADR
# with a stated reason and an expiry, not by a line in this file.
ignore = []
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    # NOT a contradiction of the `openssl` ban in `[bans]` below, and it is
    # load-bearing: removing this line turns the build red.
    #
    # `OpenSSL` here is an SPDX *licence identifier*, not the OpenSSL library.
    # It is required by `aws-lc-sys`, whose licence expression is
    # `ISC AND (Apache-2.0 OR ISC) AND OpenSSL` — AWS-LC forked BoringSSL, which
    # forked OpenSSL, so parts of it still carry the original licence text.
    # `aws-lc-sys` is the A1 rustls provider (ADR-0002 §3.6) and is therefore in
    # every binary that opens a TLS connection. The *crate* `openssl` stays
    # banned.
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
# Our own crates are proprietary and `publish = false`; they carry no SPDX
# expression, so cargo-deny needs them named here rather than in `allow`.
private = { ignore = true }

# Scoped allowances, not entries in `allow` above.
#
# `CDLA-Permissive-2.0` is a *data* licence (Community Data License Agreement),
# and the only thing it covers here is Mozilla's CA root store as shipped by the
# webpki-roots crates. Putting it in the global `allow` list would silently
# permit any future crate to arrive under a data licence whose terms were
# reviewed for a trust store, not for code. An exception names the two crates it
# actually applies to, so adding a third is a visible decision.
#
# Reached through sqlx-core 0.9.0 — the `webpki-roots` trust store ADR-0002
# §3.7.3 describes — and rustls-platform-verifier 0.7.1 (kube-client, reqwest).
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
# "warn" rather than "deny", and the reason is specific rather than a shrug.
#
# A1 asks for no duplicate `rustls`, `hmac`, `sha2` or `digest`, and
# ci/tls-provider-assertions.sh is where those four are checked by name and
# failed on. Turning this key to "deny" would additionally fail the build on
# every unrelated duplicate the ecosystem currently carries (`base64 0.22/0.23`,
# `syn 2/3`, `getrandom 0.3/0.4`, `tower-http 0.6/0.7` via kube-client and
# reqwest), none of which we can resolve from here and none of which is a
# correctness or security question. A gate that is red for reasons the team
# cannot act on stops being read.
#
# Known duplicates as of the pinned lockfile are listed in `skip` below, with
# their cause. Anything not listed shows up as a warning in the cargo-deny
# output and is a prompt to look.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# ADR-0002 §3.5 ("Explicitly excluded") and A1. Each of these is a decision, so
# each is enforced rather than remembered.
deny = [
    # `jiff` supersedes `chrono` for new code (ADR-0002 §3.5).
    { crate = "chrono", reason = "excluded by ADR-0002 §3.5; use jiff" },
    # Reservations and settlement are i64. A decimal type in the allowance path
    # reintroduces the rounding question the integer decision removed.
    { crate = "rust_decimal", reason = "excluded by ADR-0002 §3.5; allowance accounting is i64" },
    { crate = "bigdecimal", reason = "same reason as rust_decimal" },
    # rustls everywhere; no OpenSSL (ADR-0002 §3.5). The `OpenSSL` SPDX
    # identifier in `[licenses] allow` above is a different thing — see there.
    { crate = "openssl", reason = "rustls only; no OpenSSL" },
    { crate = "openssl-sys", reason = "rustls only; no OpenSSL" },
    { crate = "native-tls", reason = "rustls only; no OpenSSL" },
    # A1: exactly one rustls crypto provider, and it is aws-lc-rs. `ring` in the
    # graph means feature unification selected a second backend, which is a
    # first-TLS-handshake panic waiting to happen. The `cargo tree -i ring`
    # assertion in CI is the same check from the other direction.
    { crate = "ring", reason = "A1: aws-lc-rs is the only rustls provider" },
]

# Known duplicates, each with the upstream cause, resolved against the pinned
# lockfile on 2026-10-01. Short and specific on purpose: anything NOT listed here
# shows up as a cargo-deny warning, which is a prompt to look.
#
# `sha2`/`digest` are listed here AND asserted in
# ci/tls-provider-assertions.sh, because the two tools answer different
# questions. cargo-deny resolves one graph for the whole workspace and counts
# proc-macro dependencies; ADR-0002 §3.7.9 restates A1's duplicate assertion per
# shipped binary with `--edges normal,no-proc-macro`, which is the question about
# the artifact. A skip here does not relax anything there.
#
# The reason recorded below is NOT the one ADR-0002 §3.7.2 predicted, and the
# difference matters. §3.7.2 expected `sha2 0.10` to leave the shipping graph
# once `sqlx/migrate` was dropped from the workspace pin. It does not:
# `sqlx 0.9.0`'s own manifest declares
#
#     [dependencies.sqlx-core] version = "=0.9.0" features = ["migrate"]
#
# unconditionally, and `sqlx-core/migrate = ["sha2", "crc"]`. So `sqlx-core`'s
# optional `sha2 ^0.10` is enabled by depending on `sqlx` at all, no feature of
# ours reaches it, and `sha2 0.10.9`/`digest 0.10.7` are in every binary that
# links `vf-db`. Dropping `migrate` is still right — it was never in §3.2's
# approved list and it does remove `sqlx-macros/migrate` and
# `sqlx-postgres/migrate` — it just does not buy the single `sha2`.
#
# Raised with Atlas on VUL-40 as a §3.7.2/§3.7.9 correction. The only route to a
# literally single `sha2` at these pins is to drop the `sqlx` facade and depend
# on `sqlx-core` + `sqlx-postgres` directly, which is a `vf-db` design question
# (VUL-26), not a manifest tweak.
#
# What A1 was protecting is intact either way and is asserted hard per binary:
# one `rustls` (0.23.45), one `hmac` (0.13.0), no `ring`, no `chrono`. Every
# VulcanFlow crate that hashes is on `sha2 0.11`/`digest 0.11`; the 0.10
# generation is reachable only from sqlx-core's internal hashing and from
# `crc-fast` under the AWS checksum path, neither of which is a
# signature-verification surface.
#
# `base64 0.22/0.23` is an accepted duplicate (ADR-0002 §3.7.8) and is
# deliberately NOT skipped: it is outside A1's four crates, so a warning is the
# right volume for it.
skip = [
    { crate = "sha2:0.10.9", reason = "sqlx-core 0.9.0's optional sha2 ^0.10, enabled unconditionally by sqlx 0.9.0's own `features = [\"migrate\"]` on sqlx-core. Not reachable from any feature we select; sqlx-postgres uses 0.11. ADR-0002 §3.7.2 correction raised on VUL-40" },
    { crate = "digest:0.10.7", reason = "two causes: sha2 0.10.9 (above), and crc-fast 1.10.0 <- aws-smithy-checksums 0.65.0, which the S3 checksum path needs. ADR-0002 §3.7.9 permits the second digest by the crc-fast path; the sqlx-core path is part of the same correction" },
    { crate = "tower-http:0.6.11", reason = "accepted duplicate, ADR-0002 §3.7.8: kube-client 4.2.0 and reqwest 0.13.5 pull 0.6, our direct pin is 0.7.1. No shared state, no security surface" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies. A git dependency is not covered by the advisory database
# the same way a registry crate is, and `Cargo.lock` pins a commit that can be
# force-pushed away.
allow-git = []
