# vf-rust-check — the Tekton equivalent of the `check` job in
# .github/workflows/rust-check.yml, which GitHub runs twice from a matrix as
# `check (amd64)` on ubuntu-latest and `check (arm64)` on ubuntu-24.04-arm.
#
# The pipeline runs it once, for `check (arm64)`; the amd64 leg is the
# follow-up VFL-716 (see pipelines/rust-check.yaml). The architecture is not a
# property of the Task: it is decided by where the pod is scheduled. The `arch`
# parameter is asserted against `uname -m`, so a run that lands on the wrong
# node fails instead of reporting a green `check (arm64)` from another
# architecture. Scheduling is set in the PipelineRun's `taskRunSpecs`
# (`nodeSelector: kubernetes.io/arch`); see pipelineruns/rust-check.yaml.
#
# Why the work is one step and not six
# ------------------------------------
# Each Tekton step is a separate container that shares only the pod's volumes,
# so what one step writes under /usr/local (a rustup component, an installed
# binary, the nightly toolchain) is gone in the next. The workflow's "Show
# toolchain", tool install, `just check`, `just test-unit` and `just
# fuzz-check` steps therefore run in one step here, each behind the workflow's
# step name as a `:::` log banner. The order, the commands and the stop at the
# first failure are the workflow's; only the container boundary moved.
#
# Deliberate differences from the workflow, none of which can change a verdict:
#   - no Swatinem/rust-cache. A cache changes how long a build takes, never its
#     result. The optional `cache` workspace stands in for it by carrying
#     CARGO_TARGET_DIR across runs; cargo's own fingerprints decide what is
#     reused. Both advisory databases are cloned fresh on each run; on GitHub a
#     restored clone is fetched forward before use, so both end at the same
#     advisory set. With nothing restored, the workflow's "Show restored
#     advisory databases" step has nothing to show and is left out.
#     CARGO_INCREMENTAL=0 is set, as rust-cache does.
#   - the components and targets of rust-toolchain.toml are added explicitly.
#     On a GitHub runner the 1.99.0 toolchain is absent, so rustup installs it
#     from the toolchain file with all of them. This image already has 1.99.0
#     with the minimal profile, and rustup does not add a toolchain file's
#     components to an installed toolchain, so `cargo fmt` and `cargo clippy`
#     would be missing. The lists are read out of rust-toolchain.toml, which
#     stays the only place they are written. The fuzz nightly is absent here
#     too, so `just fuzz-check` auto-installs it exactly as on GitHub.
#   - `just`, cargo-deny and cargo-audit come from the same upstream release
#     archives taiki-e/install-action downloads (per architecture, the same
#     musl or gnu build it picks), checked against the SHA-256 digests in its
#     manifests at the pinned commit 183e4297. cargo-deny 0.20.2 and
#     cargo-audit 0.22.2 are the workflow's pins; the workflow leaves `just`
#     unpinned and resolved it to 1.58.0 on 2026-10-09 and 2026-10-13, which
#     is pinned here. They go to $CARGO_HOME/bin, which is on PATH.
#   - CARGO_BUILD_JOBS=4, the vCPU count of both GitHub runners, so a node with
#     more cores does not run more rustc processes than the memory limit allows.
#   - the step runs as an unprivileged user. The image makes RUSTUP_HOME and
#     CARGO_HOME writable for every user, which is all the step writes outside
#     the checkout and /tmp.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: vf-rust-check
  namespace: vf-ci
  labels:
    app.kubernetes.io/part-of: vf-ci
spec:
  description: >-
    Runs `just check`, `just test-unit` and `just fuzz-check` on one
    architecture against a revision of vulcanflow/platform. Equivalent to one
    matrix leg of the check job of .github/workflows/rust-check.yml.

  params:
    - name: repo-url
      type: string
      description: Clone URL of the repository under test.
      default: https://github.com/vulcanflow/platform.git
    - name: revision
      type: string
      description: Full 40-character commit SHA, or a ref, to test.
    - name: arch
      type: string
      description: >-
        amd64 or arm64, the architecture this run claims to be. Asserted
        against the pod's own `uname -m`; it does not select the node.
    - name: image
      type: string
      description: >-
        Pinned toolchain image. The channel matches rust-toolchain.toml and the
        digest is the multi-architecture index, so the same pin resolves to the
        amd64 and to the arm64 image.
      default: docker.io/library/rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6

  results:
    - name: commit
      description: The commit the check ran against (git rev-parse HEAD).

  workspaces:
    - name: source
      description: Where the repository is cloned. Bind an emptyDir.
    - name: cache
      description: >-
        Optional. Carries CARGO_TARGET_DIR between runs, standing in for
        Swatinem/rust-cache. Bind a separate PVC per architecture: object files
        are not portable between them, which is why the workflow keys its cache
        on the matrix architecture.
      optional: true

  stepTemplate:
    env:
      - name: HOME
        value: /tmp
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

  steps:
    # actions/checkout at its default depth of 1. Same script as in
    # tasks/lane-gate.yaml; see the comments there.
    - name: checkout
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      computeResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir repo
        cd repo
        git init -q -b vf-ci .
        git remote add origin "$REPO_URL"
        git fetch --no-tags --depth=1 origin "+${REVISION}:refs/vf-ci/head"
        git checkout -q --detach refs/vf-ci/head
        git --no-pager log -1 --format='HEAD %H %s'
        git rev-parse HEAD | tr -d '\n' > "$(results.commit.path)"

    - name: check
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        # CARGO_TERM_COLOR and RUSTFLAGS are the workflow's top-level `env:`
        # block, verbatim; RUSTFLAGS applies to every cargo invocation below, as
        # it does to every step there. The other two are explained in the
        # header.
        - name: CARGO_TERM_COLOR
          value: always
        - name: RUSTFLAGS
          value: -D warnings
        - name: CARGO_INCREMENTAL
          value: "0"
        - name: CARGO_BUILD_JOBS
          value: "4"
        - name: ARCH
          value: $(params.arch)
      computeResources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 10Gi
        limits:
          memory: 8Gi
          ephemeral-storage: 20Gi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd repo

        banner() { printf '\n::: %s\n' "$1"; }

        # --- the architecture this pod landed on ----------------------------
        case "$(uname -m)" in
          x86_64)  host_arch=amd64 ;;
          aarch64) host_arch=arm64 ;;
          *) echo "unsupported machine $(uname -m)" >&2; exit 1 ;;
        esac
        if [ "$host_arch" != "$ARCH" ]; then
          echo "this run claims arch '$ARCH' but the pod is $host_arch ($(uname -m))." >&2
          echo "fix the nodeSelector in the PipelineRun's taskRunSpecs." >&2
          exit 1
        fi
        banner "architecture: $ARCH ($(uname -m))"

        # --- optional stand-in for Swatinem/rust-cache ----------------------
        if [ "$(workspaces.cache.bound)" = "true" ]; then
          CARGO_TARGET_DIR="$(workspaces.cache.path)/target-${ARCH}"
          export CARGO_TARGET_DIR
          mkdir -p "$CARGO_TARGET_DIR"
          banner "CARGO_TARGET_DIR=$CARGO_TARGET_DIR (cache workspace bound)"
        fi

        # --- components and targets from rust-toolchain.toml ----------------
        # `components` is one line and `targets` spans several; the awk range
        # handles both.
        toml_array() {
          awk "/^[[:space:]]*$1[[:space:]]*=/,/\]/" rust-toolchain.toml \
            | grep -oE '"[^"]+"' | tr -d '"'
        }
        mapfile -t components < <(toml_array components)
        mapfile -t targets < <(toml_array targets)
        [ "${#components[@]}" -gt 0 ] || { echo "no components found in rust-toolchain.toml" >&2; exit 1; }
        [ "${#targets[@]}" -gt 0 ]    || { echo "no targets found in rust-toolchain.toml" >&2; exit 1; }
        banner "rustup component add ${components[*]}"
        rustup component add "${components[@]}"
        banner "rustup target add ${targets[*]}"
        rustup target add "${targets[@]}"

        # --- Show toolchain (workflow step) ---------------------------------
        banner "Show toolchain"
        rustc --version
        cargo --version
        rustup target list --installed

        # --- Install just, cargo-deny, cargo-audit (workflow step) ----------
        banner "Install just, cargo-deny, cargo-audit"
        # Host tools, so the build for the machine the pod runs on.
        case "$host_arch" in
          amd64)
            deny_asset=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
            deny_sha=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
            audit_asset=cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
            audit_sha=7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
            just_asset=just-1.58.0-x86_64-unknown-linux-musl.tar.gz
            just_sha=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
            ;;
          arm64)
            deny_asset=cargo-deny-0.20.2-aarch64-unknown-linux-musl.tar.gz
            deny_sha=995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d
            audit_asset=cargo-audit-aarch64-unknown-linux-gnu-v0.22.2.tgz
            audit_sha=c6603814ddaa45e51263dafd31c0ac98808f688d26f7395804f9670b0fd599dd
            just_asset=just-1.58.0-aarch64-unknown-linux-musl.tar.gz
            just_sha=748237128c4c40cbdabc65e841d05ceba13cc23a91eaba395495894c1d9764df
            ;;
        esac
        tmp="$(mktemp -d)"
        fetch() { # fetch <url> <sha256>
          curl -sSfL --retry 3 --retry-connrefused -o "$tmp/${1##*/}" "$1"
          printf '%s  %s\n' "$2" "$tmp/${1##*/}" | sha256sum -c -
        }
        fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$deny_asset" "$deny_sha"
        fetch "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/$audit_asset" "$audit_sha"
        fetch "https://github.com/casey/just/releases/download/1.58.0/$just_asset" "$just_sha"
        # cargo-deny and cargo-audit ship inside one top-level directory; the
        # just archive has its binary at the root.
        bin="$CARGO_HOME/bin"
        tar -xzf "$tmp/$deny_asset"  -C "$bin" --strip-components=1 --wildcards '*/cargo-deny'
        tar -xzf "$tmp/$audit_asset" -C "$bin" --strip-components=1 --wildcards '*/cargo-audit'
        tar -xzf "$tmp/$just_asset"  -C "$bin" just
        rm -rf "$tmp"
        just --version
        cargo-deny --version
        cargo-audit --version

        # --- just check (workflow step) -------------------------------------
        banner "just check"
        just check

        # --- just test-unit (workflow step) ---------------------------------
        banner "just test-unit"
        just test-unit

        # --- just fuzz-check (workflow step) --------------------------------
        banner "just fuzz-check"
        just fuzz-check
