# vf-rust-check — the Tekton equivalent of .github/workflows/rust-check.yml.
#
# The workflow is one job run from a two-entry matrix, which GitHub reports as
# `check (amd64)` and `check (arm64)`. This Pipeline has the arm64 leg only, as
# PipelineTask `check-arm64` with display name `check (arm64)` (a Tekton task
# name cannot hold parentheses or spaces).
#
# The amd64 leg is not here yet. Every zolab node is arm64, so it cannot run
# natively; Cortana decided on 2026-10-13 (VFL-125) to cross-build it on an
# arm64 node with the unit tests under user-mode QEMU, as a follow-up (VFL-716).
# Until then GitHub's rust-check.yml keeps running both legs. When it lands it
# is a second PipelineTask with no `runAfter` on this one, so one architecture
# failing does not hide the other's result, as with the workflow's
# `fail-fast: false`.
#
# Where the leg runs is not decided here. A Pipeline cannot carry a pod
# template, so the `kubernetes.io/arch` nodeSelector is set in the PipelineRun
# (`taskRunSpecs`); see pipelineruns/rust-check.yaml. The Task asserts
# `uname -m` against its `arch` parameter, so a run scheduled onto the wrong
# architecture fails instead of reporting a false green.
#
# Not one of the four required contexts on `main`, as the workflow is not; a red
# result still blocks the merge under the same rule.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: vf-rust-check
  namespace: vf-ci
  labels:
    app.kubernetes.io/part-of: vf-ci
spec:
  description: >-
    `just check`, `just test-unit` and `just fuzz-check` on arm64. Same pinned
    toolchain, same commands and same pass/fail rules as the arm64 leg of
    .github/workflows/rust-check.yml.

  params:
    - name: repo-url
      type: string
      default: https://github.com/vulcanflow/platform.git
    - name: revision
      type: string
      description: >-
        Full commit SHA or ref under test. For a pull request, the merge
        commit (refs/pull/N/merge); for a push, the pushed commit.
    - name: image
      type: string
      default: docker.io/library/rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6

  workspaces:
    - name: source
      description: >-
        Bind an emptyDir; each TaskRun gets its own checkout. Not a PVC: one
        PVC shared by several TaskRuns makes Tekton's affinity assistant put
        them all on one node.
    - name: cache-arm64
      description: >-
        Optional. CARGO_TARGET_DIR for the arm64 leg (a PVC). Named per
        architecture because object files are not portable between them.
      optional: true

  tasks:
    - name: check-arm64
      displayName: check (arm64)
      taskRef:
        name: vf-rust-check
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: arch
          value: arm64
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
        - name: cache
          workspace: cache-arm64
