# vf-lane-gate — the Tekton equivalent of .github/workflows/lane-gate.yml.
#
# Five PipelineTasks with no `runAfter` between them, so they start together as
# five GitHub jobs do (the workflow has no `needs:` either). Once one Task
# fails, Tekton starts no further Task but lets the running ones finish; all
# five have started by then, so all five verdicts are recorded, which is what
# VFL-126 reports to the PR commit.
#
# The PipelineTask names are the GitHub job names character for character:
# lane-partition, test-erosion, inline-test-modules, uses-pins, gate-self-test.
# These five names are the status contexts. All but uses-pins are required
# contexts on `main`, so renaming one here renames a required check; uses-pins
# becomes required when VFL-126 rebinds the required contexts.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: vf-lane-gate
  namespace: vf-ci
  labels:
    app.kubernetes.io/part-of: vf-ci
spec:
  description: >-
    The VulcanFlow delivery-lane gate (ADR-0005) as a Tekton Pipeline. Same five
    checks, same scripts and same pass/fail rules as
    .github/workflows/lane-gate.yml.

  params:
    - name: repo-url
      type: string
      default: https://github.com/vulcanflow/platform.git
    - name: revision
      type: string
      description: >-
        Full commit SHA or ref under test. For a pull request, the merge
        commit (refs/pull/N/merge), which is what actions/checkout uses.
    - name: base-branch
      type: string
      description: Base branch of the pull request, exported as GITHUB_BASE_REF.
      default: main
    - name: image
      type: string
      default: docker.io/library/rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6

  workspaces:
    - name: source
      description: >-
        Bind an emptyDir. Tekton creates it per pod, so each of the five
        TaskRuns gets its own checkout, as each GitHub job does.

  tasks:
    # actions/checkout with fetch-depth: 0, then "Fetch base branch".
    - name: lane-partition
      taskRef:
        name: vf-lane-gate
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: base-branch
          value: $(params.base-branch)
        - name: subcommand
          value: partition
        - name: fetch-depth
          value: "0"
        - name: fetch-base
          value: "true"
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source

    # actions/checkout with fetch-depth: 0, then "Fetch base branch".
    - name: test-erosion
      taskRef:
        name: vf-lane-gate
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: base-branch
          value: $(params.base-branch)
        - name: subcommand
          value: erosion
        - name: fetch-depth
          value: "0"
        - name: fetch-base
          value: "true"
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source

    # actions/checkout at its default depth, no base fetch.
    - name: inline-test-modules
      taskRef:
        name: vf-lane-gate
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: base-branch
          value: $(params.base-branch)
        - name: subcommand
          value: inline-tests
        - name: fetch-depth
          value: "1"
        - name: fetch-base
          value: "false"
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source

    # actions/checkout at its default depth, no base fetch.
    - name: uses-pins
      taskRef:
        name: vf-lane-gate
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: base-branch
          value: $(params.base-branch)
        - name: subcommand
          value: pins
        - name: fetch-depth
          value: "1"
        - name: fetch-base
          value: "false"
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source

    - name: gate-self-test
      taskRef:
        name: vf-lane-gate-selftest
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
