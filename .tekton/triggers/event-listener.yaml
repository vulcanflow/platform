# Receives the GitHub webhook for vulcanflow/platform.
#
# Every trigger runs the `github` ClusterInterceptor first. It checks the
# X-Hub-Signature / X-Hub-Signature-256 HMAC against the Secret
# vf-ci/vf-ci-webhook (key `secret`) and the X-GitHub-Event type; a request
# that is unsigned, wrongly signed or of another event type stops there and
# creates nothing. The `cel` interceptor that follows only narrows which signed
# events start a run.
#
# A pull request starts the checks (pull-request-template.yaml) only when its
# head branch is in vulcanflow/platform itself. The checks run the pull
# request's code, so a pull request from a fork starts nothing; it gets no
# Tekton result, and a required check with no result blocks the merge. When the
# fork has been deleted, head.repo is null, the filter fails to evaluate, and
# that too starts nothing. A branch push still starts only vf-ci-noop.
#
# A `synchronize` delivery, a push to the pull request's branch, also matches
# pull-request-supersede. Each trigger acts on the delivery on its own, so the
# delivery starts the two checks for the new head and one vf-ci-supersede run,
# which cancels the unfinished checks for the head the push replaced
# (supersede-pipeline.yaml). `opened` and `reopened` cancel nothing.
#
# The Secret is not in this directory. The owner creates it in the cluster, or
# has already created it, from the value set on the webhook; see README.md.
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: vf-platform
  namespace: vf-ci
  labels:
    app.kubernetes.io/part-of: vf-ci
spec:
  serviceAccountName: vf-ci-triggers
  triggers:
    - name: pull-request
      interceptors:
        - name: verify-github-signature
          ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: vf-ci-webhook
                secretKey: secret
            - name: eventTypes
              value: ["pull_request"]
        - name: platform-pr-updates
          ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: >-
                body.repository.full_name == 'vulcanflow/platform' &&
                body.pull_request.head.repo.full_name == 'vulcanflow/platform' &&
                body.action in ['opened', 'synchronize', 'reopened']
      bindings:
        - ref: vf-github-pull-request
      template:
        ref: vf-pull-request
    # The filter of pull-request above, narrowed to `synchronize`.
    - name: pull-request-supersede
      interceptors:
        - name: verify-github-signature
          ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: vf-ci-webhook
                secretKey: secret
            - name: eventTypes
              value: ["pull_request"]
        - name: platform-pr-synchronize
          ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: >-
                body.repository.full_name == 'vulcanflow/platform' &&
                body.pull_request.head.repo.full_name == 'vulcanflow/platform' &&
                body.action == 'synchronize'
      bindings:
        - ref: vf-github-pull-request-supersede
      template:
        ref: vf-pull-request-supersede
    - name: push
      interceptors:
        - name: verify-github-signature
          ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: vf-ci-webhook
                secretKey: secret
            - name: eventTypes
              value: ["push"]
        - name: platform-branch-pushes
          ref:
            name: cel
            kind: ClusterInterceptor
          params:
            # Branch pushes only; tag pushes and branch deletions start nothing.
            - name: filter
              value: >-
                body.repository.full_name == 'vulcanflow/platform' &&
                body.ref.startsWith('refs/heads/') &&
                !body.deleted
      bindings:
        - ref: vf-github-push
      template:
        ref: vf-ci-noop
