# What each GitHub event contributes to a PipelineRun. The pull-request
# binding feeds pull-request-template.yaml, the push binding
# trigger-template.yaml.
#
# Header names are written in Go's canonical form (X-Github-..., not
# X-GitHub-...), which is how the EventListener stores request headers.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: vf-github-pull-request
  namespace: vf-ci
  labels:
    app.kubernetes.io/part-of: vf-ci
spec:
  params:
    - name: event-type
      value: $(header.X-Github-Event)
    - name: delivery-id
      value: $(header.X-Github-Delivery)
    - name: pr-number
      value: $(body.pull_request.number)
    # The commit the result is for, and the ref that is tested: the merge of
    # that head into the base branch (see pull-request-template.yaml).
    - name: head-sha
      value: $(body.pull_request.head.sha)
    - name: merge-ref
      value: refs/pull/$(body.pull_request.number)/merge
    - name: base-branch
      value: $(body.pull_request.base.ref)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: vf-github-push
  namespace: vf-ci
  labels:
    app.kubernetes.io/part-of: vf-ci
spec:
  params:
    - name: event-type
      value: $(header.X-Github-Event)
    - name: delivery-id
      value: $(header.X-Github-Delivery)
    - name: repo-full-name
      value: $(body.repository.full_name)
    - name: git-ref
      value: $(body.ref)
    - name: revision
      value: $(body.after)
    # A push has no base branch; the template defaults it to "".
