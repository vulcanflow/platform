# What each GitHub event contributes to a PipelineRun. Both bindings produce
# the same parameter set so one TriggerTemplate serves both triggers.
#
# Header names are written in Go's canonical form (X-Github-..., not
# X-GitHub-...), which is how the EventListener stores request headers.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: vf-github-pull-request
  namespace: vf-ci
  labels:
    app.kubernetes.io/part-of: vf-ci
spec:
  params:
    - name: event-type
      value: $(header.X-Github-Event)
    - name: delivery-id
      value: $(header.X-Github-Delivery)
    - name: repo-full-name
      value: $(body.repository.full_name)
    - name: git-ref
      value: refs/pull/$(body.pull_request.number)/head
    - name: revision
      value: $(body.pull_request.head.sha)
    - name: base-branch
      value: $(body.pull_request.base.ref)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: vf-github-push
  namespace: vf-ci
  labels:
    app.kubernetes.io/part-of: vf-ci
spec:
  params:
    - name: event-type
      value: $(header.X-Github-Event)
    - name: delivery-id
      value: $(header.X-Github-Delivery)
    - name: repo-full-name
      value: $(body.repository.full_name)
    - name: git-ref
      value: $(body.ref)
    - name: revision
      value: $(body.after)
    # A push has no base branch; the template defaults it to "".
