# VulcanFlow Cargo workspace.
#
# One workspace, one toolchain, one lockfile — TDD §2.5.2 and ADR-0001
# ("the single Rust build unit containing all VulcanFlow crates").
#
# Every version below is the pin approved in ADR-0002 §3 and amendments A1
# (§3.6) and A2 (§3.7). Where §3.1–§3.2 and §3.7 disagree, §3.7 is the
# authority: it corrects six feature names that did not exist or meant the
# opposite of what §3 said, and withdraws two crates. Member crates take
# dependencies from
# `[workspace.dependencies]` with `workspace = true` and never restate a
# version, so the pin exists in exactly one place.

[workspace]
resolver = "3"
members = [
    # Library crates. Safety-relevant logic lives here so it can be
    # property-tested and fuzzed in isolation (TDD §2.5.2).
    "crates/vf-core",
    "crates/vf-graph",
    "crates/vf-translator",
    "crates/vf-authz",
    "crates/vf-db",
    "crates/vf-store",
    # Binary crates.
    "crates/vf-api",
    "crates/vf-operator",
    "crates/vf-admission",
    "crates/vf-ingest",
    "crates/vf-report",
    "crates/vf-meter",
    "crates/vf-abuse",
    "crates/vf-hook-notify",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
authors = ["VulcanFlow Engineering"]
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/vulcanflow"

# ---------------------------------------------------------------------------
# Lints. Applied to every member via `[lints] workspace = true`.
# ---------------------------------------------------------------------------

[workspace.lints.rust]
# ADR-0002 §2 also requires the `#![forbid(unsafe_code)]` attribute in every
# crate root. Both are present on purpose: the attribute survives a crate being
# vendored or moved out of this workspace.
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# TDD §2.5.2: no `unwrap`/`expect` on external input paths. Denying them
# everywhere is cheaper than deciding per call site which path is external.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# ADR-0002 §3.5: no `f64` and no `rust_decimal` anywhere in the allowance path.
# `cargo deny` bans the crate; this bans the arithmetic.
float_arithmetic = "deny"
# Reservations and settlements are `i64` with explicit overflow handling. This
# makes a bare `+`/`-`/`*` a compile error, so `checked_*` is the only way to
# write the allowance path.
arithmetic_side_effects = "deny"
# Determinism: ordered containers wherever order can be observed. The banned
# types and the reasoning are in clippy.toml.
disallowed_types = "deny"

# Both of the above are deny-by-default and relaxed in source, not in a manifest:
# Cargo does not allow a member to add to an inherited `[lints]` table, and an
# `#![allow(clippy::arithmetic_side_effects)]` at a crate root with a stated
# reason is visible to a reviewer in a way a manifest line is not.

# ---------------------------------------------------------------------------
# Pinned external dependencies — ADR-0002 §3.
# ---------------------------------------------------------------------------

[workspace.dependencies]

# §3.1 Runtime, HTTP, API surface
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
    "sync",
] }
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "http2",
    "json",
    "tokio",
    "tower-log",
    "tracing",
] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = [
    "trace",
    "request-id",
    "timeout",
    "limit",
    "sensitive-headers",
] }
utoipa = { version = "6.0.0", default-features = false, features = [
    "macros",
    "axum_extras",
    "uuid",
    "jiff_0_2",
    "preserve_order",
] }
utoipa-axum = { version = "0.3.0", default-features = false }
# `utoipa-swagger-ui` is NOT pinned here: §3.7.7 withdraws it from the approved
# set. Its build script fetches the Swagger UI distribution over the network,
# which cannot be reproducible (§21.3). The §1081 deliverable is the published
# OpenAPI 3.1 document, which `utoipa` + `utoipa-axum` produce on their own.
askama = { version = "0.16.1", default-features = false, features = [
    "std",
    "derive",
    "config",
    "urlencode",
] }
serde = { version = "1.0.229", default-features = false, features = [
    "std",
    "derive",
] }
serde_json = { version = "1.0.151", default-features = false, features = [
    "std",
    "preserve_order",
] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "json",
    "env-filter",
    "registry",
] }
uuid = { version = "1.26.1", default-features = false, features = ["std", "serde"] }
# `chrono` is excluded by ADR-0002 §3.5; `jiff` supersedes it for new code.
jiff = { version = "0.2.37", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    # §3.1 named this `rustls-tls`; reqwest 0.13 renamed the feature to
    # `rustls` (and `rustls-no-provider` for the bring-your-own variant), so
    # the old name does not build. `rustls` expands to `__rustls-aws-lc-rs` +
    # `rustls-platform-verifier`, which is the A1 provider. Corrected by
    # §3.7.1; the verifier this selects is the OS trust store, see §3.7.3.
    "rustls",
    "http2",
    "json",
    "charset",
] }

# §3.2 Data, Kubernetes, object storage
# §3.7.1 corrects the TLS feature and §3.7.2 removes `migrate`.
#
# `tls-rustls` in sqlx 0.9 is an alias chain: `tls-rustls` = `tls-rustls-ring`
# = `tls-rustls-ring-webpki`, which enables `rustls/ring`. Naming the provider
# explicitly is what keeps `ring` out of every binary that opens a connection,
# which is every binary.
#
# `migrate` is deliberately absent: it was never in §3.2's approved feature list,
# and §21.2 runs migrations from exactly one binary (`vf-migrate`, not yet
# created), which opts in on top of this pin:
#
#     sqlx = { workspace = true, features = ["migrate"] }
#
# Dropping it does remove `sqlx-macros/migrate` and `sqlx-postgres/migrate`. It
# does NOT achieve what §3.7.2 expected of it, and the manifest should not claim
# otherwise: `sqlx 0.9.0`'s own manifest declares
#
#     [dependencies.sqlx-core] version = "=0.9.0" features = ["migrate"]
#
# unconditionally, and `sqlx-core/migrate = ["sha2", "crc"]`. So `sqlx-core`'s
# optional `sha2 ^0.10` is on as soon as anything depends on `sqlx`, no feature
# of ours can reach it, and `sha2 0.10.9` stays in every binary that links
# `vf-db`. Raised with Atlas on VUL-40 as a §3.7.2/§3.7.9 correction; the only
# route to a literally single `sha2` is to drop the `sqlx` facade and depend on
# `sqlx-core` + `sqlx-postgres` directly, which is a `vf-db` design question
# (VUL-26) rather than a manifest change.
#
# `json` is here for the JSONB columns in §6.3.
#
# §3.7.3: `tls-rustls-aws-lc-rs` verifies against `webpki-roots` — *public* CA
# roots only — so it cannot verify the CNPG server certificate issued by
# Aether's internal CA. `vf-db` supplies `ssl_root_cert` per connection
# (acceptance criterion on VUL-26). `tls-rustls-ring-native-roots` would use
# the system store instead and is rejected: it brings `ring`.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "macros",
    "uuid",
    "json",
] }
kube = { version = "4.2.0", default-features = false, features = [
    "client",
    "config",
    "derive",
    "runtime",
    "admission",
    "jsonpatch",
    "rustls-tls",
    # §3.7.1: `kube`'s own default is `["client", "rustls-tls", "ring"]`. With
    # `default-features = false` and no provider feature, `kube-client` gets
    # rustls with no provider enabled by itself; with defaults it gets `ring`.
    # Neither is A1's decision, so the provider is named here rather than left
    # to feature unification. `config` resolves in-cluster and kubeconfig;
    # `jsonpatch` re-exports the `json-patch` already pinned in §3.2.
    "aws-lc-rs",
] }
# `=`-pin per ADR-0002 §3.2: `kube 4.2.0` declares `k8s-openapi ^0.28.0` and a
# mismatch is the classic kube-rs build break.
#
# `v1_32` is decided in §3.7.4, not a placeholder: it is the floor 0.28.0
# offers, and k8s-openapi's generated types for an older minor stay valid
# against a newer API server. Compiling against the floor means
# `vf-operator`/`vf-admission` can only name surface every supported minor
# serves, so a field the real cluster lacks is a *compile* error rather than a
# reconcile that silently stops short. Raising the floor is then a deliberate
# act. (If Aether's control plane is older than 1.32, this pair is wrong
# outright — that is CEO's to confirm and is filed separately; §24.2 puts the
# operator after the services and nothing in Phase 1 reconciles a CRD.)
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["std", "v1_32"] }
json-patch = { version = "4.2.0", default-features = false }
# §3.7.1, correcting §3.5's "rustls everywhere".
#
# On the AWS SDK the feature named `rustls` is the *legacy* client, not the rustls
# one: `aws-sdk-s3/rustls` and `aws-sdk-s3/legacy-https-client` both expand to
# `aws-smithy-runtime/tls-rustls`, which selects `aws-smithy-http-client`'s
# hyper-0.14 stack — and that stack is rustls **0.21** plus **ring**. rustls 0.21
# predates the pluggable-provider API, so ring is not optional there.
#
# Enabling it therefore breaks both of A1's assertions at once: `cargo tree -i
# ring` is non-empty and `rustls` appears twice (0.21.12 and 0.23.45). Verified by
# resolving this workspace; `aws-config/rustls` is the same trap (it expands to
# `client-hyper`).
#
# `default-https-client` is the modern path: hyper 1.x, rustls 0.23, aws-lc-rs,
# which is the provider A1 chose.
aws-sdk-s3 = { version = "1.151.0", default-features = false, features = [
    "rt-tokio",
    "default-https-client",
    "http-1x",
    # NOT `sigv4a` (§3.7.1). SigV4a is AWS multi-region signing; Ceph RGW and
    # RustFS do not use it, and it drags `p256`/`ecdsa`/`rfc6979`, which pull
    # `hmac 0.12` and `sha2 0.10` — a second RustCrypto generation, which is
    # exactly what A1's duplicate assertion is there to catch.
] }
aws-config = { version = "1.12.0", default-features = false, features = [
    "rt-tokio",
    "default-https-client",
] }

# §3.6 (amendment A1) Crypto, encoding, TLS
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
# A1: OS CSPRNG only. `OsRng`, never a seeded or thread-local generator, on the
# challenge-token and idempotency-nonce paths.
rand = { version = "0.10.3", default-features = false, features = ["std", "sys_rng"] }
# A1: Lago signatures are standard base64 **with padding** — not URL-safe, not
# no-pad. Call sites use `base64::engine::general_purpose::STANDARD`.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
# A1: direct pin even though rustls also arrives transitively, so that the
# provider feature is decided here and not by feature unification.
rustls = { version = "0.23.45", default-features = false, features = [
    "std",
    "tls12",
    "logging",
    "aws-lc-rs",
] }

# §3.4 Test-side pins. Pinned here because pinning is a workspace convention;
# the test *content* belongs to Scribe (property, fuzz) and Ledger
# (integration). Coding agents do not author tests.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
arbitrary = { version = "1.4.2", default-features = false, features = ["derive"] }
insta = { version = "1.48.0", default-features = false }
# §3.7.1, correcting §3.4's `testcontainers 0.28.0`. That version cannot resolve
# alongside `testcontainers-modules 0.15.0`: 0.15.0 is the newest modules release
# and it declares `testcontainers ^0.27.0`. There is no modules release for 0.28
# yet, and 0.28 pulls `bollard 0.21` while 0.27 pulls an earlier bollard, so the
# conflict is not a caret-range artefact. 0.27.3 is the newest version satisfying
# both. §3.7.1 says revisit — raise both together — when a `testcontainers-modules`
# release declaring `^0.28` publishes.
testcontainers = { version = "0.27.3", default-features = false }
testcontainers-modules = { version = "0.15.0", default-features = false }

# ---------------------------------------------------------------------------
# Internal crates.
# ---------------------------------------------------------------------------
vf-core = { path = "crates/vf-core" }
vf-graph = { path = "crates/vf-graph" }
vf-translator = { path = "crates/vf-translator" }
vf-authz = { path = "crates/vf-authz" }
vf-db = { path = "crates/vf-db" }
vf-store = { path = "crates/vf-store" }

# ---------------------------------------------------------------------------
# Profiles. §21.3 requires reproducible arm64 builds; see .cargo/config.toml
# for the path remapping that makes the artifact independent of the build
# directory.
# ---------------------------------------------------------------------------
[profile.release]
debug = false
strip = "symbols"
codegen-units = 1
lto = "thin"
incremental = false
# Deliberately NOT `panic = "abort"`. TDD §2.5.2 requires a handler panic to be
# caught at the service boundary and reported as a platform error, never as a
# target outcome, and `catch_unwind` needs unwinding to exist.
panic = "unwind"
